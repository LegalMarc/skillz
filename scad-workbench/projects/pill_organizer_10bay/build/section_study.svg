<text x="859.0" y="650.5" font-size="12" fill="#555" text-anchor="start" font-weight="normal">below repose &#8212; unreachable</text>
<text x="834.0" y="682.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="bold">the floor has to fall toward the outlet at the</text>
<text x="834.0" y="697.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="normal">repose angle or steeper, at every point. So it</text>
<text x="834.0" y="712.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="normal">can never sit below a straight line drawn at</text>
<text x="834.0" y="727.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="normal">that angle from tray A. The straight ramp IS</text>
<text x="834.0" y="742.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="normal">the lowest floor; a curve is either above it</text>
<text x="834.0" y="757.5" font-size="11.2" fill="#8c3b25" text-anchor="start" font-weight="normal">(less volume) or below it (stagnant pills).</text>
