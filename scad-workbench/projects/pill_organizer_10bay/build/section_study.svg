<text x="879.0" y="650.7" font-size="12" fill="#555" text-anchor="start" font-weight="normal">lid</text>
<text x="854.0" y="694.7" font-size="11.5" fill="#8c3b25" text-anchor="start" font-weight="bold">a shallower ramp lowers hopper A's floor, and</text>
<text x="854.0" y="710.7" font-size="11.5" fill="#8c3b25" text-anchor="start" font-weight="normal">hopper B's floor rides on it, so both deepen.</text>
<text x="854.0" y="726.7" font-size="11.5" fill="#8c3b25" text-anchor="start" font-weight="normal">The only thing 48&#176; was buying was a self-</text>
<text x="854.0" y="742.7" font-size="11.5" fill="#8c3b25" text-anchor="start" font-weight="normal">supporting chute ceiling &#8212; and that ceiling is</text>
<text x="854.0" y="758.7" font-size="11.5" fill="#8c3b25" text-anchor="start" font-weight="normal">an internal surface nobody sees.</text>
