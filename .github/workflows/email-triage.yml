name: Email triage checks
on:
  push:
    paths: ["email-triage/**", ".github/workflows/email-triage.yml"]
  pull_request:
    paths: ["email-triage/**", ".github/workflows/email-triage.yml"]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Test synthetic workflows without a mailbox
        working-directory: email-triage
        env:
          EMAIL_TRIAGE_CONFIG: ${{ runner.temp }}/email-triage-no-profile.json
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
